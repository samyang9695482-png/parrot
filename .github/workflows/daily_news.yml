# ============================================================
# 鹦鹉全球金融早报 - 每日自动抓取新闻
# 北京时间每天 06:00 运行（GitHub Actions 用 UTC：22:00 前一天）
# 也可在仓库 Actions 页面手动点击 "Run workflow" 立即执行
# ============================================================

name: Daily News Fetch

on:
  schedule:
    # UTC 22:00 = 北京时间第二天 06:00
    # ┌───────── 分钟 (0-59)
    # │  ┌────── 小时 (0-23, UTC)
    # │  │  ┌──── 日期 (1-31)
    # │  │  │  ┌─ 月份 (1-12)
    # │  │  │  │  ┌ 星期 (0-6, 0=周日)
    # │  │  │  │  │
    - cron: "0 22 * * *"

  # 允许手动触发（方便你调试，随时点一下就跑）
  workflow_dispatch:

jobs:
  fetch-news:
    name: Fetch & Process News
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # 1. 拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Python 3.11
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 把 GitHub Secrets 写到 .env 文件
      #    （注意：Secrets 要在仓库 Settings → Secrets and variables → Actions 里配置）
      - name: Generate .env file
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL=${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}
          DEEPSEEK_MODEL=${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          EOF

      # 5. 运行抓取脚本
      - name: Run fetch_news.py
        run: python fetch_news.py
        timeout-minutes: 15

      # 6. 失败告警（可选，把错误输出打印出来方便排查）
      - name: Show debug info on failure
        if: failure()
        run: |
          echo "脚本执行失败，下面是 .env 文件检查（仅显示长度，避免泄露 Key）"
          wc -c .env
