<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#1a3a5c" />
  <meta name="description" content="鹦鹉全球金融早报 - 每日8点，看懂全球金融" />
  <title>鹦鹉全球金融早报</title>

  <!-- PWA 清单文件 -->
  <link rel="manifest" href="./manifest.json" />

  <!-- 样式表 -->
  <link rel="stylesheet" href="./style.css" />

  <!-- 图标 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦜%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦜%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- 顶部品牌区 + 横向栏目导航 -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">🦜</span>
        <div class="brand-text">
          <h1 class="brand-title">鹦鹉全球金融早报</h1>
          <p class="brand-subtitle">每日8点，看懂全球金融</p>
        </div>
      </div>
      <div class="date-display" id="dateDisplay"></div>
    </div>
    <!-- 四个栏目横向导航：全球 | 贵金属 | 股票 | 币圈 -->
    <nav class="nav-tabs" id="categoryTabs" aria-label="栏目导航"></nav>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    <div id="loadingState" class="loading-state">
      <div class="loading-spinner"></div>
      <p class="loading-text">正在加载今日新闻...</p>
    </div>
    <div id="newsContainer"></div>
    <!-- 底部品牌信息（替代原下载按钮位置） -->
    <footer class="brand-footer">
      <div class="brand-footer-inner">
        <span class="brand-footer-icon">🦜</span>
        <span class="brand-footer-text">鹦鹉全球金融早报 · 每日8点，看懂全球金融</span>
      </div>
    </footer>
  </main>

  <!-- 新闻详情弹层（半屏 sheet，关怀版风格） -->
  <div class="detail-overlay" id="detailOverlay" hidden></div>
  <aside class="detail-modal" id="detailModal" hidden role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <button class="detail-close" id="detailClose" aria-label="关闭详情" type="button">✕</button>
    <div class="detail-content">
      <h2 class="detail-title" id="detailTitle"></h2>
      <div class="detail-meta">
        <span class="detail-meta-item" id="detailSource"></span>
        <span class="detail-meta-item" id="detailTime"></span>
      </div>
      <div class="detail-body" id="detailBody"></div>
    </div>
  </aside>

  <script>
    // ============================================================
    // 🔑 配置区
    // ============================================================
    const SUPABASE_URL = 'https://jrriwqflqmsxsgqazmcg.supabase.co';
    // ✅ Supabase anon publishable key（用户 08-19 提供；严格区分字母 O/l 与数字 0/1）
    const SUPABASE_ANON_KEY = 'sb_publishable_qazOCCYcoQLmsbVnpBl2LQ_DiEUEApx';

    const NEWS_PER_CATEGORY = 3;            // 首页每栏目显示的标题条数
    // 当日所有新闻缓存：详情页从这里按 idx 取数据，避免 dataset 存大字符串
    let newsDataCache = [];
    // 按栏目分组的全量新闻（首页/全部列表都从这里取）
    let newsByCategory = {};
    // 当前选中的栏目 key，默认"全球"
    let currentCategory = 'global';
    // 当前视图模式：'home' = 首页 3 条标题；'all' = 全部列表（标题+摘要）
    let viewMode = 'home';
    const CATEGORIES = [
      { key: 'global',          name: '🌍 全球',     desc: '全球经济、央行政策、地缘政治' },
      { key: 'precious_metals', name: '💰 贵金属',   desc: '黄金、白银' },
      { key: 'stock',           name: '📈 股票',     desc: '美股、港股' },
      { key: 'crypto',          name: '🪙 币圈',     desc: '比特币、虚拟币' }
    ];

    // ============================================================
    // 工具函数
    // ============================================================

    function getBeijingDate(offsetDays = 0) {
      // ✅ 无论浏览器本地时区是什么，统一按「北京时间 UTC+8」计算日期
      // Date.now() 本身就是 UTC epoch ms，直接 +8h 偏移就是"北京时间的绝对时刻"
      // 然后用 getUTC* 系列方法读出这个时刻的年月日，就是北京时间的年月日
      // offsetDays=0 → 今天；offsetDays=1 → 明天（北京时间）
      const BEIJING_OFFSET_MS = 8 * 60 * 60 * 1000;
      const bjEpochMs = Date.now() + BEIJING_OFFSET_MS + offsetDays * 24 * 60 * 60 * 1000;
      const bjDate = new Date(bjEpochMs);
      const y = bjDate.getUTCFullYear();
      const m = String(bjDate.getUTCMonth() + 1).padStart(2, '0');
      const d = String(bjDate.getUTCDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getTodayString() {
      return getBeijingDate(0);   // 北京时间 今日
    }

    function getTomorrowString() {
      return getBeijingDate(1);   // 北京时间 明日
    }

    function formatDisplayDate() {
      // 同样用北京时间显示，避免跨时区显示成"昨天"
      const BEIJING_OFFSET_MS = 8 * 60 * 60 * 1000;
      const now = new Date(Date.now() + BEIJING_OFFSET_MS);
      const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      return `${now.getUTCFullYear()}年${now.getUTCMonth() + 1}月${now.getUTCDate()}日 ${weekdays[now.getUTCDay()]}`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // ============================================================
    // 带超时的 fetch
    // ============================================================

    function fetchWithTimeout(url, options, timeout = 5000) {
      return Promise.race([
        fetch(url, options),
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error('请求超时（5秒）')), timeout)
        )
      ]);
    }

    // ============================================================
    // Supabase 数据读取（改用范围查询，解决日期匹配问题）
    // ============================================================

    async function fetchTodayNews() {
      const today = getTodayString();
      const tomorrow = getTomorrowString();
      // ✅ 范围查询：date >= 今日 00:00 AND date < 明日 00:00
      //    覆盖 DATE 列（纯日期）和 TIMESTAMPTZ 列（带时间）两种情况
      const url = `${SUPABASE_URL}/rest/v1/news?select=*&date=gte.${today}&date=lt.${tomorrow}&order=created_at.desc`;

      console.log('📡 请求 URL:', url);
      console.log('🕐 北京时间今日:', today, '  明日:', tomorrow);

      const resp = await fetchWithTimeout(url, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json'
        }
      }, 5000);

      if (!resp.ok) {
        const text = await resp.text();
        throw new Error(`HTTP ${resp.status}: ${text}`);
      }
      return resp.json();
    }

    // ============================================================
    // 渲染：状态机模式
    //   renderNews  → 拉到数据后分组并初始化状态
    //   renderTabs  → 顶部 4 个 tab
    //   renderCurrentView → 根据 currentCategory + viewMode 渲染主体
    // ============================================================

    function renderNews(newsList) {
      const container = document.getElementById('newsContainer');
      container.innerHTML = '';
      newsDataCache = [];

      if (!newsList || newsList.length === 0) {
        // 数据为空也要清空 tabs，避免误点
        document.getElementById('categoryTabs').innerHTML = '';
        container.innerHTML = `
          <div style="text-align:center;padding:40px 20px;color:#999;font-size:20px;">
            📭 今日暂无更新<br>
            <small style="font-size:16px;color:#ccc;">系统每天 06:00 自动抓取最新新闻</small>
          </div>
        `;
        return;
      }

      // 按栏目分组到 newsByCategory
      newsByCategory = {};
      CATEGORIES.forEach(cat => { newsByCategory[cat.key] = []; });
      newsList.forEach(item => {
        if (newsByCategory[item.category]) {
          newsByCategory[item.category].push(item);
        }
      });

      renderTabs();
      renderCurrentView();
    }

    // 顶部 4 个 tab：选中态加 nav-tab--active
    function renderTabs() {
      const bar = document.getElementById('categoryTabs');
      bar.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'nav-tab' + (cat.key === currentCategory ? ' nav-tab--active' : '');
        btn.textContent = cat.name;
        btn.setAttribute('aria-pressed', cat.key === currentCategory ? 'true' : 'false');
        btn.addEventListener('click', () => switchCategory(cat.key));
        bar.appendChild(btn);
      });
    }

    // 切换栏目：默认回到 home 模式
    function switchCategory(key) {
      if (key === currentCategory && viewMode === 'home') return;
      currentCategory = key;
      viewMode = 'home';
      renderTabs();
      renderCurrentView();
      // 切换后滚到顶部，避免停留在原位置
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 渲染当前视图（home 或 all）
    function renderCurrentView() {
      const container = document.getElementById('newsContainer');
      container.innerHTML = '';
      newsDataCache = []; // 详情缓存按当前视图重建

      const cat = CATEGORIES.find(c => c.key === currentCategory) || CATEGORIES[0];
      const items = newsByCategory[currentCategory] || [];

      if (viewMode === 'home') {
        renderHomeView(cat, items);
      } else {
        renderAllView(cat, items);
      }
    }

    // home 模式：栏目头（标题 + 更多按钮）+ 3 条标题列表
    function renderHomeView(cat, items) {
      const container = document.getElementById('newsContainer');
      const section = document.createElement('section');
      section.className = 'category-section';

      // 栏目头：左标题 + 右"更多"按钮（仅当条数超过 3 才显示）
      const header = document.createElement('div');
      header.className = 'category-header category-header--with-more';
      header.innerHTML = `
        <div class="category-header-text">
          <h2 class="category-title">${escapeHtml(cat.name)}</h2>
          <span class="category-desc">${escapeHtml(cat.desc)}</span>
        </div>
        ${items.length > NEWS_PER_CATEGORY ? `<button class="more-btn" type="button">更多 ›</button>` : ''}
      `;
      section.appendChild(header);

      // 绑定更多按钮 → 切到 all 视图
      const moreBtn = header.querySelector('.more-btn');
      if (moreBtn) {
        moreBtn.addEventListener('click', () => {
          viewMode = 'all';
          renderCurrentView();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      if (items.length === 0) {
        const placeholder = document.createElement('div');
        placeholder.className = 'news-card empty-card';
        placeholder.innerHTML = `<p class="empty-text">暂无更新</p>`;
        section.appendChild(placeholder);
      } else {
        items.slice(0, NEWS_PER_CATEGORY).forEach(item => {
          const idx = newsDataCache.length;
          newsDataCache.push(item);
          const row = buildTitleRow(item, idx);
          section.appendChild(row);
        });
      }
      container.appendChild(section);
    }

    // all 模式：返回栏 + 该栏目全部新闻（标题 + 摘要，可点进详情）
    function renderAllView(cat, items) {
      const container = document.getElementById('newsContainer');

      // 返回栏
      const backBar = document.createElement('div');
      backBar.className = 'back-bar';
      backBar.innerHTML = `
        <button class="back-btn" type="button" aria-label="返回首页">‹ 返回</button>
        <h2 class="back-bar-title">${escapeHtml(cat.name)} · 全部 ${items.length} 条</h2>
      `;
      backBar.querySelector('.back-btn').addEventListener('click', () => {
        viewMode = 'home';
        renderCurrentView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      container.appendChild(backBar);

      // 列表
      const list = document.createElement('div');
      list.className = 'all-news-list';
      if (items.length === 0) {
        const placeholder = document.createElement('div');
        placeholder.className = 'news-card empty-card';
        placeholder.innerHTML = `<p class="empty-text">暂无更新</p>`;
        list.appendChild(placeholder);
      } else {
        items.forEach(item => {
          const idx = newsDataCache.length;
          newsDataCache.push(item);
          const card = document.createElement('article');
          card.className = 'news-card news-card--clickable';
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', '0');
          card.innerHTML = `
            <h3 class="news-title">${escapeHtml(item.title || '无标题')}</h3>
            <p class="news-summary">${escapeHtml(item.summary || '暂无摘要')}</p>
            <span class="news-read-more">查看详情 ›</span>
          `;
          card.addEventListener('click', () => openDetail(idx));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openDetail(idx);
            }
          });
          list.appendChild(card);
        });
      }
      container.appendChild(list);
    }

    // 构造"标题列表项"（home 模式每条）
    function buildTitleRow(item, idx) {
      const row = document.createElement('article');
      row.className = 'news-list-item';
      row.setAttribute('role', 'button');
      row.setAttribute('tabindex', '0');
      row.innerHTML = `
        <span class="news-list-bullet" aria-hidden="true">·</span>
        <h3 class="news-list-title">${escapeHtml(item.title || '无标题')}</h3>
        <span class="news-list-arrow" aria-hidden="true">›</span>
      `;
      row.addEventListener('click', () => openDetail(idx));
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openDetail(idx);
        }
      });
      return row;
    }

    // ============================================================
    // 详情弹层：打开 / 关闭
    // ============================================================

    function formatPublishTime(item) {
      // 优先 published，其次 created_at；都没有返回空串
      const raw = (item.published || item.created_at || '').toString().trim();
      if (!raw) return '';
      // 尝试转成北京时间可读格式；解析失败就退回原样
      const d = new Date(raw);
      if (isNaN(d.getTime())) return raw;
      const BEIJING_OFFSET_MS = 8 * 60 * 60 * 1000;
      const bj = new Date(d.getTime() + BEIJING_OFFSET_MS);
      const y = bj.getUTCFullYear();
      const m = String(bj.getUTCMonth() + 1).padStart(2, '0');
      const day = String(bj.getUTCDate()).padStart(2, '0');
      const hh = String(bj.getUTCHours()).padStart(2, '0');
      const mm = String(bj.getUTCMinutes()).padStart(2, '0');
      return `${y}-${m}-${day} ${hh}:${mm}`;
    }

    function openDetail(idx) {
      const item = newsDataCache[idx];
      if (!item) return;

      document.getElementById('detailTitle').textContent = item.title || '无标题';
      document.getElementById('detailSource').textContent =
        item.source ? `来源：${item.source}` : '';
      const t = formatPublishTime(item);
      document.getElementById('detailTime').textContent = t ? `发布时间：${t}` : '';

      // 正文优先 full_text；为空则退回 summary；都没有则占位
      const fullText = (item.full_text && item.full_text.toString().trim())
        || (item.summary && item.summary.toString().trim())
        || '暂无正文内容';
      document.getElementById('detailBody').textContent = fullText;

      const overlay = document.getElementById('detailOverlay');
      const modal = document.getElementById('detailModal');
      overlay.hidden = false;
      modal.hidden = false;
      document.body.classList.add('detail-open'); // 锁背景滚动
      // 把焦点放到关闭按钮，方便键盘用户立刻按 esc / 回车关闭
      setTimeout(() => document.getElementById('detailClose').focus(), 50);
    }

    function closeDetail() {
      document.getElementById('detailOverlay').hidden = true;
      document.getElementById('detailModal').hidden = true;
      document.body.classList.remove('detail-open');
    }

    // ============================================================
    // 主流程
    // ============================================================

    async function main() {
      document.getElementById('dateDisplay').textContent = formatDisplayDate();

      const loading = document.getElementById('loadingState');
      const container = document.getElementById('newsContainer');

      try {
        console.log('🚀 开始加载数据...');
        const news = await fetchTodayNews();
        console.log('✅ 获取到数据条数:', news.length);
        renderNews(news);
      } catch (err) {
        console.error('❌ 加载失败:', err);
        container.innerHTML = `
          <div style="text-align:center;padding:40px 20px;color:#e74c3c;font-size:18px;">
            ⚠️ 加载失败<br>
            <small style="font-size:16px;color:#999;display:block;margin-top:12px;">${escapeHtml(err.message)}</small>
            <small style="font-size:14px;color:#ccc;display:block;margin-top:8px;">请稍后刷新重试</small>
          </div>
        `;
      } finally {
        loading.style.display = 'none';
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./service-worker.js')
          .then(reg => console.log('Service Worker 注册成功:', reg.scope))
          .catch(err => console.warn('Service Worker 注册失败:', err));
      });
    }

    // ============================================================
    // 详情弹层事件绑定：X 按钮 / 点遮罩关闭 / Esc 关闭
    // ============================================================
    document.getElementById('detailClose').addEventListener('click', closeDetail);
    document.getElementById('detailOverlay').addEventListener('click', closeDetail);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !document.getElementById('detailModal').hidden) {
        closeDetail();
      }
    });

    main();
  </script>
</body>
</html>
