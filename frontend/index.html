<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#1a3a5c" />
  <meta name="description" content="鹦鹉全球金融早报 - 每日8点，看懂全球金融" />
  <title>鹦鹉全球金融早报</title>

  <!-- PWA 清单文件 -->
  <link rel="manifest" href="./manifest.json" />

  <!-- 样式表 -->
  <link rel="stylesheet" href="./style.css" />

  <!-- 图标 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦜%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦜%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- 顶部品牌区 -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon">🦜</span>
        <div class="brand-text">
          <h1 class="brand-title">鹦鹉全球金融早报</h1>
          <p class="brand-subtitle">每日8点，看懂全球金融</p>
        </div>
      </div>
      <div class="date-display" id="dateDisplay"></div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="main-content">
    <div id="loadingState" class="loading-state">
      <div class="loading-spinner"></div>
      <p class="loading-text">正在加载今日新闻...</p>
    </div>
    <div id="newsContainer"></div>
    <div class="bottom-spacer"></div>
  </main>

  <!-- 底部固定下载按钮 -->
  <footer class="download-footer">
    <a
      id="downloadBtn"
      href="https://pan.quark.cn/s/your-share-id"
      target="_blank"
      rel="noopener noreferrer"
      class="download-btn"
    >
      📦 下载完整数据包
    </a>
  </footer>

  <script>
    // ============================================================
    // 🔑 配置区：请确保 SUPABASE_ANON_KEY 是完整的 anon 密钥
    // ============================================================
    const SUPABASE_URL = 'https://jrriwqflqmsxsgqazmcg.supabase.co';
    // ⚠️ 下面这一行改成你从 Supabase API 页面复制的完整 anon 密钥
    const SUPABASE_ANON_KEY = 'sb_publishable_qaz0CCYcoQLmsbVnpB1L2LQ_DiEUEtTgXxJ';

    const NEWS_PER_CATEGORY = 2;
    const CATEGORIES = [
      { key: 'global',          name: '🌍 全球',     desc: '全球经济、央行政策、地缘政治' },
      { key: 'precious_metals', name: '💰 贵金属',   desc: '黄金、白银' },
      { key: 'stock',           name: '📈 股票',     desc: '美股、港股' },
      { key: 'crypto',          name: '🪙 币圈',     desc: '比特币、虚拟币' }
    ];

    // ============================================================
    // 工具函数
    // ============================================================

    function getTodayString() {
      const now = new Date();
      const bjTime = new Date(now.getTime() + (8 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60 * 1000));
      const y = bjTime.getFullYear();
      const m = String(bjTime.getMonth() + 1).padStart(2, '0');
      const d = String(bjTime.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDisplayDate() {
      const now = new Date();
      const bjTime = new Date(now.getTime() + (8 * 60 * 60 * 1000) + (now.getTimezoneOffset() * 60 * 1000));
      const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      return `${bjTime.getFullYear()}年${bjTime.getMonth() + 1}月${bjTime.getDate()}日 ${weekdays[bjTime.getDay()]}`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // ============================================================
    // 带超时的 fetch（5秒超时，防止无限转圈）
    // ============================================================

    function fetchWithTimeout(url, options, timeout = 5000) {
      return Promise.race([
        fetch(url, options),
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error('请求超时（5秒）')), timeout)
        )
      ]);
    }

    // ============================================================
    // Supabase 数据读取
    // ============================================================

    async function fetchTodayNews() {
      const today = getTodayString();
      const url = `${SUPABASE_URL}/rest/v1/news?select=*&date=eq.${today}&order=created_at.desc`;

      console.log('📡 请求 URL:', url);

      const resp = await fetchWithTimeout(url, {
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type': 'application/json'
        }
      }, 5000);

      if (!resp.ok) {
        const text = await resp.text();
        throw new Error(`HTTP ${resp.status}: ${text}`);
      }
      return resp.json();
    }

    async function fetchCachedNews() {
      try {
        const cache = await caches.open('parrot-news-cache');
        const keys = await cache.keys();
        for (const req of keys) {
          if (req.url.includes('news-cache-')) {
            const resp = await cache.match(req);
            if (resp) return resp.json();
          }
        }
      } catch (e) {
        console.warn('读取缓存失败:', e);
      }
      return null;
    }

    async function cacheNewsData(data) {
      try {
        const cache = await caches.open('parrot-news-cache');
        const today = getTodayString();
        await cache.put(
          new Request(`news-cache-${today}.json`),
          new Response(JSON.stringify(data), {
            headers: { 'Content-Type': 'application/json' }
          })
        );
        const keys = await cache.keys();
        const threeDaysAgo = Date.now() - 3 * 24 * 60 * 60 * 1000;
        for (const req of keys) {
          const match = req.url.match(/news-cache-(\d{4})-(\d{2})-(\d{2})\.json/);
          if (match) {
            const [, y, m, d] = match;
            const cacheDate = new Date(`${y}-${m}-${d}`).getTime();
            if (cacheDate < threeDaysAgo) {
              await cache.delete(req);
            }
          }
        }
      } catch (e) {
        console.warn('缓存数据失败:', e);
      }
    }

    // ============================================================
    // 渲染
    // ============================================================

    function renderNews(newsList) {
      const container = document.getElementById('newsContainer');
      container.innerHTML = '';

      if (!newsList || newsList.length === 0) {
        container.innerHTML = `
          <div style="text-align:center;padding:40px 20px;color:#999;font-size:20px;">
            📭 今日暂无更新<br>
            <small style="font-size:16px;color:#ccc;">系统每天 06:00 自动抓取最新新闻</small>
          </div>
        `;
        return;
      }

      const grouped = {};
      CATEGORIES.forEach(cat => { grouped[cat.key] = []; });
      newsList.forEach(item => {
        if (grouped[item.category]) {
          grouped[item.category].push(item);
        }
      });

      CATEGORIES.forEach(cat => {
        const section = document.createElement('section');
        section.className = 'category-section';
        section.innerHTML = `
          <div class="category-header">
            <h2 class="category-title">${escapeHtml(cat.name)}</h2>
            <span class="category-desc">${escapeHtml(cat.desc)}</span>
          </div>
        `;

        const items = (grouped[cat.key] || []).slice(0, NEWS_PER_CATEGORY);

        if (items.length === 0) {
          const placeholder = document.createElement('div');
          placeholder.className = 'news-card empty-card';
          placeholder.innerHTML = `<p class="empty-text">暂无更新</p>`;
          section.appendChild(placeholder);
        } else {
          items.forEach(item => {
            const card = document.createElement('article');
            card.className = 'news-card';
            card.innerHTML = `
              <h3 class="news-title">${escapeHtml(item.title || '无标题')}</h3>
              <p class="news-summary">${escapeHtml(item.summary || '暂无摘要')}</p>
            `;
            section.appendChild(card);
          });
        }
        container.appendChild(section);
      });
    }

    // ============================================================
    // 主流程
    // ============================================================

    async function main() {
      document.getElementById('dateDisplay').textContent = formatDisplayDate();

      const loading = document.getElementById('loadingState');
      const container = document.getElementById('newsContainer');

      try {
        console.log('🚀 开始加载数据...');
        const news = await fetchTodayNews();
        console.log('✅ 获取到数据条数:', news.length);
        await cacheNewsData(news);
        renderNews(news);
      } catch (err) {
        console.error('❌ 加载失败:', err);
        container.innerHTML = `
          <div style="text-align:center;padding:40px 20px;color:#e74c3c;font-size:18px;">
            ⚠️ 加载失败<br>
            <small style="font-size:16px;color:#999;display:block;margin-top:12px;">${escapeHtml(err.message)}</small>
            <small style="font-size:14px;color:#ccc;display:block;margin-top:8px;">请稍后刷新重试</small>
          </div>
        `;
      } finally {
        loading.style.display = 'none';
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./service-worker.js')
          .then(reg => console.log('Service Worker 注册成功:', reg.scope))
          .catch(err => console.warn('Service Worker 注册失败:', err));
      });
    }

    main();
  </script>
</body>
</html>
